spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # Milestone 4 Backend Route (must precede the general /api/** rule below)
            - id: career-service-route
              uri: ${CAREER_SERVICE_URL:lb://CAREER-SERVICE}
              predicates:
                - Path=/api/career/**

            # Milestone 1 Backend Route
            - id: skill-management-service-route
              uri: ${SKILL_SERVICE_URL:lb://SKILL-MANAGEMENT-SERVICE}
              predicates:
                - Path=/api/**

            # Milestone 2 Backend Route
            - id: learning-service-route
              uri: ${LEARNING_SERVICE_URL:lb://LEARNING-SERVICE}
              predicates:
                - Path=/learning-api/**
              filters:
                - StripPrefix=1

            # Milestone 3 Backend Route
            - id: certification-management-service-route
              uri: ${CERTIFICATION_SERVICE_URL:lb://CERTIFICATION-MANAGEMENT-SERVICE}
              predicates:
                - Path=/certification-api/**
              filters:
                 - StripPrefix=1

            # Notification Service Route (Unified Notification Center)
            - id: notification-service-route
              uri: ${NOTIFICATION_SERVICE_URL:lb://NOTIFICATION-SERVICE}
              predicates:
                - Path=/notification-api/**
              filters:
                 - StripPrefix=1

server:
  port: ${PORT:8085}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:${EUREKA_ENABLED:false}}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_URL:http://eureka-server:8761/eureka/}}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:false}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:false}

  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:true}
    hostname: ${EUREKA_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}